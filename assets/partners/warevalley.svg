<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
  <!-- Stylized W mark: cyan / yellow / navy -->
  <!-- Left arm - cyan -->
  <polygon points="8,14 20,50 28,30" fill="#4EC6D4"/>
  <!-- Center - yellow -->
  <polygon points="20,50 32,14 44,50" fill="#F7C948"/>
  <!-- Right arm - navy -->
  <polygon points="44,50 56,14 52,14 40,46 32,14 28,30 36,50" fill="#1B3A6B"/>
  <!-- Simplified: three chevrons forming W -->
  <path d="M6 16 L18 52 L30 20 L42 52 L54 16" fill="none" stroke="#4EC6D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 16 L26 52 L38 16" fill="none" stroke="#F7C948" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 20 L42 52 L54 16" fill="none" stroke="#1B3A6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- WARE VALLEY text -->
  <text x="68" y="34" font-family="'Arial Black','Arial',sans-serif" font-size="22" font-weight="900" fill="#4A5568" letter-spacing="2">WARE</text>
  <text x="68" y="56" font-family="'Arial Black','Arial',sans-serif" font-size="22" font-weight="900" fill="#4A5568" letter-spacing="2">VALLEY</text>
</svg>
