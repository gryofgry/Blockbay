<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8457C"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Hexagonal outline -->
  <polygon points="30,6 54,16 54,44 30,54 6,44 6,16" fill="none" stroke="url(#hexGrad)" stroke-width="4"/>
  <!-- Inner hexagon accent -->
  <polygon points="30,14 46,21 46,39 30,46 14,39 14,21" fill="url(#hexGrad)" opacity="0.1"/>
  <!-- 7B text inside hex -->
  <text x="30" y="37" font-family="'Arial Black','Arial',sans-serif" font-size="18" font-weight="900" fill="url(#hexGrad)" text-anchor="middle">7B</text>
  <!-- 78리서치랩 text -->
  <text x="66" y="28" font-family="'Arial Black','Arial',sans-serif" font-size="20" font-weight="800" fill="#2D3748">78</text>
  <text x="96" y="28" font-family="'Arial','Helvetica',sans-serif" font-size="16" font-weight="700" fill="#2D3748">리서치랩</text>
  <!-- English subtitle -->
  <text x="66" y="46" font-family="'Arial','Helvetica',sans-serif" font-size="11" fill="#9CA3AF" letter-spacing="1">RESEARCH LAB</text>
</svg>
