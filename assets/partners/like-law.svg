<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8942E"/>
    </linearGradient>
  </defs>
  <!-- Monogram square -->
  <rect x="4" y="12" width="56" height="56" rx="4" fill="url(#goldGrad)"/>
  <!-- L I K E letters in quadrants -->
  <text x="17" y="38" font-family="'Georgia','Times New Roman',serif" font-size="16" font-weight="700" fill="#FFFFFF">L</text>
  <text x="37" y="38" font-family="'Georgia','Times New Roman',serif" font-size="16" font-weight="700" fill="#FFFFFF">I</text>
  <text x="17" y="58" font-family="'Georgia','Times New Roman',serif" font-size="16" font-weight="700" fill="#FFFFFF">K</text>
  <text x="37" y="58" font-family="'Georgia','Times New Roman',serif" font-size="16" font-weight="700" fill="#FFFFFF">E</text>
  <!-- Divider lines -->
  <line x1="32" y1="16" x2="32" y2="64" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
  <line x1="8" y1="42" x2="56" y2="42" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
  <!-- LIKE text -->
  <text x="72" y="38" font-family="'Georgia','Times New Roman',serif" font-size="28" font-weight="700" fill="#C5A55A" letter-spacing="6">LIKE</text>
  <!-- LAW OFFICE subtitle -->
  <text x="72" y="56" font-family="'Arial','Helvetica',sans-serif" font-size="13" fill="#555555" letter-spacing="4">LAW OFFICE</text>
</svg>
